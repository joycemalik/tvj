line_name: "Lyman Alpha (Lya)"
rest_wavelength: 1216.0       # Angstrom
model: "single_gaussian"

# ===========================================================================
# WING WINDOW CONVENTION
# ===========================================================================
# wing_window is the FULL window width (confirmed from original JS source):
#   I = R.wingWindow / 2
#   min = center - I
#   max = center + I
#
# Approved examples (from reference dataset):
#   Spectrum 15:  center=1215,    wing=20, min=1205,    max=1225
#   Spectrum 16:  center=1216,    wing=21, min=1205.5,  max=1226.5
#   Spectrum 17:  center=1217,    wing=21, min=1206.5,  max=1227.5
#   Spectrum 18:  center=1214.5,  wing=19, min=1205,    max=1224
#   Spectrum 153: center=1213,    wing=18, min=1204,    max=1222
#   Spectrum 172: center=1213.75, wing=17, min=1205.25, max=1222.25
# ===========================================================================

amplitude:
  # Auto-computed analytically via Stage-B weighted least-squares per triplet.
  # No grid steps required.

center:
  range: 5.0          # Search +-5 A around observed emission peak
  step: 0.25          # Grid step for search (A) — 0.25 is sufficient resolution

# ===========================================================================
# WIDTH AND WINDOW RANGES (continuous min–max, not a fixed list)
# ===========================================================================
# For a Gaussian, FWHM = 2*sqrt(2 ln 2)*sigma = 2.3548*sigma.
#
# FWHM 10–24 Å (rest frame):
#   - approved Lyα fits span FWHM 10.6–20.0 Å (2600–4950 km/s);
#   - 3C 273 broad Lyα widths ~3000–4500 km/s (Paltani & Türler 2005, A&A 435, 811);
#   - floor: no line can look narrower than the instrument. IUE SWP low-dispersion
#     resolution is ~6 Å FWHM observed (IUE NEWSIPS manual §2.3.2.1), i.e.
#     6/(1+z) = 5.2 Å in these de-redshifted spectra (z = 0.158).
# sigma = FWHM / 2.3548  ->  4.25–10.19 Å. Sigma is continuous inside these
# bounds: the grid below only seeds the least-squares refinement (src/refine.py).
# Wing window (full width of the reference-style integration window) 10–24 Å:
#   approved windows span 13–23 Å, hand-entered ones go down to 10 Å.
# ===========================================================================
sigma:
  min: 4.25           # Å  (FWHM 10 Å)
  max: 10.19          # Å  (FWHM 24 Å)
  step: 0.2           # seed-grid step only
  prior_center: 6.3   # campaign mean sigma (seed scoring only)
  prior_std:    1.5

wing_window:
  min: 10             # Å, full width
  max: 24
  step: 1
  prior_center: 18.0
  prior_std:    2.5

# Per-spectrum peak search: brightest smoothed pixel within ±radius of the rest
# wavelength; the peak position therefore differs from spectrum to spectrum.
peak_search_radius: 15.0

# Least-squares refinement: Lyα and N V overlap, so both are fitted together
# with a local linear continuum over 1180–1265 Å.
refine:
  window: [1180, 1265]
  center_tol: 8.0
  companions:
    - {rest: 1240.0, sigma_min: 2.2, sigma_max: 12.0, sigma_seed: 6.0}

# Detection: flux / flux_err >= snr_min. Low reduced χ² is not penalised.
snr_min: 3.0
snr_max: 20.0
chi2_red_max: 5.0

# Manuscript method (/v4): power law fitted in line-free windows on both sides of the line;
# the line flux is integrated between them (λmin = 1185, λmax = 1262).
manuscript:
  continuum_windows: [[1170, 1185], [1262, 1275]]
