line_name: "Si IV + O IV]"
rest_wavelength: 1400.0       # Angstrom (Si IV 1393.8 + 1402.8, O IV] 1402.0 blend)

center:
  range: 8.0
  step: 0.5

# sigma floor = IUE instrumental sigma: 6 Å FWHM observed / (1+z) / 2.3548 = 2.2 Å.
# sigma ceiling = FWHM 33 Å — blend spans ~9 Å of component separation plus broad wings.
# Sigma is continuous inside [min, max]; the step only seeds src/refine.py.
sigma:
  min: 2.2
  max: 14.0
  step: 0.5

wing_window:
  min: 12
  max: 24
  step: 1

peak_search_radius: 15.0

refine:
  window: [1370, 1430]
  center_tol: 8.0

snr_min: 3.0
snr_max: 15.0
chi2_red_max: 5.0

# Manuscript method (/v4): power law fitted in line-free windows on both sides of the line;
# the line flux is integrated between them (λmin = 1372, λmax = 1428).
manuscript:
  continuum_windows: [[1360, 1372], [1428, 1440]]
