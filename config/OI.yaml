line_name: "O I + Si II"
rest_wavelength: 1305.0       # Angstrom (O I 1302.2 + Si II 1304.4 blend)

center:
  range: 6.0
  step: 0.5

# sigma floor = IUE instrumental sigma: 6 Å FWHM observed / (1+z) / 2.3548 = 2.2 Å.
# sigma ceiling = FWHM 28 Å — blend of two components ~2 Å apart plus broad wings.
# Sigma is continuous inside [min, max]; the step only seeds src/refine.py.
sigma:
  min: 2.2
  max: 12.0
  step: 0.5

wing_window:
  min: 10
  max: 20
  step: 1

peak_search_radius: 12.0

refine:
  window: [1280, 1325]
  center_tol: 8.0

snr_min: 3.0
snr_max: 15.0
chi2_red_max: 5.0

# Manuscript method (/v4): power law fitted in line-free windows on both sides of the line;
# the line flux is integrated between them (λmin = 1288, λmax = 1318).
manuscript:
  continuum_windows: [[1280, 1288], [1318, 1324]]
