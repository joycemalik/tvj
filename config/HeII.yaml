line_name: "He II"
rest_wavelength: 1640.0       # Angstrom (He II 1640.4)

center:
  range: 5.0
  step: 0.5

# sigma floor = IUE instrumental sigma: 6 Å FWHM observed / (1+z) / 2.3548 = 2.2 Å.
# sigma ceiling = FWHM 28 Å (~5200 km/s), generous for a weak broad line.
# Sigma is continuous inside [min, max]; the step only seeds src/refine.py.
sigma:
  min: 2.2
  max: 12.0
  step: 0.5

wing_window:
  min: 12
  max: 22
  step: 1

peak_search_radius: 12.0

refine:
  window: [1620, 1655]
  center_tol: 8.0

snr_min: 3.0
snr_max: 15.0
chi2_red_max: 5.0

# Manuscript method (/v4): power law fitted in line-free windows on both sides of the line;
# the line flux is integrated between them (λmin = 1622, λmax = 1684).
manuscript:
  continuum_windows: [[1612, 1622], [1684, 1696]]
  companions:
    - {rest: 1665.0, sigma_min: 2.2, sigma_max: 10.0, sigma_seed: 4.0}
