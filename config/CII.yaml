line_name: "C II"
rest_wavelength: 1335.0       # Angstrom (C II 1334.5 + 1335.7 doublet)

center:
  range: 5.0
  step: 0.5

# sigma floor = IUE instrumental sigma: 6 Å FWHM observed / (1+z) / 2.3548 = 2.2 Å.
# sigma ceiling = FWHM 23.5 Å (~5300 km/s) — a weak low-ionisation line, narrower than Lyα.
# Sigma is continuous inside [min, max]; the step only seeds src/refine.py.
sigma:
  min: 2.2
  max: 10.0
  step: 0.5

wing_window:
  min: 10
  max: 20
  step: 1

peak_search_radius: 10.0

refine:
  window: [1318, 1352]
  center_tol: 8.0

snr_min: 3.0
snr_max: 15.0
chi2_red_max: 5.0
