line_name: "C IV"
label: "CIV"                  # short name used in plots and the workbook (teacher's naming)
rest_wavelength: 1549.0       # Angstrom (C IV doublet 1548.2 + 1550.8, blended)

center:
  range: 6.0
  step: 0.5

# sigma floor = IUE instrumental sigma: 6 Å FWHM observed / (1+z) / 2.3548 = 2.2 Å.
# sigma ceiling = FWHM 33 Å (~6400 km/s); 3C 273 C IV FWHM ~3500–5000 km/s (Paltani & Türler 2005).
# Sigma is continuous inside [min, max]; the step only seeds src/refine.py.
sigma:
  min: 2.2
  max: 14.0
  step: 0.5

wing_window:
  min: 14
  max: 25
  step: 1

peak_search_radius: 15.0

refine:
  window: [1495, 1595]            # teacher's fitting window (references/CT-3C273-LUCK-EMMY.xls)
  center_tol: 8.0

# ===========================================================================
# NARROW + BROAD PROFILE
# ===========================================================================
# C IV = narrow core + broad base, two Gaussians fitted together (src/refine.py).
# The σ ranges do not overlap, so the components cannot swap. Fitted freely, the
# two trade flux and the broad flux is poorly constrained in most spectra, so the
# broad centre and σ are held fixed at the teacher's hand-fit values (below);
# only the amplitudes (and
# the narrow centre/σ) are fitted per spectrum. `sigma` above still seeds the grid.
profile: narrow_broad
narrow:
  sigma_min: 2.2        # instrumental
  sigma_max: 9.0
  center_tol: 3.0       # around this spectrum's observed peak
broad:
  sigma_min: 9.0
  sigma_max: 25.0
  center_tol: 10.0
  # teacher's hand fits (references/CT-3C273-LUCK-EMMY.xls, sheet Check), median of 15 spectra.
  # derive_broad_shape.py gives the data-only alternative (1546.54 / 12.86).
  center_fixed: 1546.0
  sigma_fixed: 15.0      # FWHM 35.3 Å

snr_min: 3.0
snr_max: 15.0
chi2_red_max: 5.0

# Manuscript method (/v4): power law fitted in line-free windows on both sides of the line;
# the line flux is integrated between them (λmin = 1510, λmax = 1590).
manuscript:
  continuum_windows: [[1495, 1510], [1590, 1605]]
